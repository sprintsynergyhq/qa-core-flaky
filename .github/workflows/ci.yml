name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:html
      - name: Check for em dashes
        run: |
          # grep exits 1 when it finds nothing. That is the passing case.
          if grep -rn $'\u2014' . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "Found an em dash. Remove it."
            exit 1
          fi
